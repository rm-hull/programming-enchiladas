# Demo registry for the v2-nextgen static rebuild.
#
# Seeded from the ~35 examples listed in the original README
# (https://github.com/rm-hull/programming-enchiladas/blob/master/README.md).
#
# Notes:
# - `added` is deliberately omitted here. The fetcher should backfill it from the
#   Gist API's `created_at` field at fetch time unless a demo needs a specific
#   override (e.g. if the gist itself predates when it was actually added to the
#   site). Add an explicit `added: YYYY-MM-DD` per-entry only if that distinction
#   actually matters for a given demo.
# - `tags` below are inferred from each gist's title/description, not verified
#   against the actual source — expect to refine these once Phase 2 (fetcher)
#   pulls real content and Phase 0 confirms which legacy libs a given demo needs.
# - Ordering follows gist_id, which is roughly chronological (GitHub gist ids are
#   assigned sequentially), as a rough proxy for original creation order.

